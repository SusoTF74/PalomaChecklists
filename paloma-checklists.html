// ─── UTILS ─────────────────────────────────────────────────────────────────
function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function canaryDate(){try{return new Intl.DateTimeFormat('sv-SE',{timeZone:'Atlantic/Canary',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch{return new Date().toISOString().slice(0,10)}}
function calcTimer(){
  try{
    const pts=new Intl.DateTimeFormat('en-US',{timeZone:'Atlantic/Canary',hour:'numeric',minute:'numeric',second:'numeric',hour12:false}).formatToParts(new Date());
    const h=+pts.find(p=>p.type==='hour').value,m=+pts.find(p=>p.type==='minute').value,sv=+pts.find(p=>p.type==='second').value;
    const cur=h*3600+m*60+sv,rst=23*3600+59*60,d=cur<=rst?rst-cur:86400-cur+rst;
    return[Math.floor(d/3600),Math.floor(d%3600/60),d%60].map(x=>String(x).padStart(2,'0')).join(':');
  }catch{return'--:--:--'}
}
function pickR(probs){const r=Math.random()*100;let c=0;for(const[k,v]of Object.entries(probs)){c+=v;if(r<c)return k}return'comun'}
function rollPack(type,pool){
  if(!pool||!pool.length)return[];
  const cfg=SOBRES[type],drawn=[];
  for(let i=0;i<cfg.n;i++){
    const rar=pickR(cfg.probs),cands=pool.filter(c=>c.rarity===rar);
    drawn.push((cands.length?cands:pool)[Math.floor(Math.random()*(cands.length?cands:pool).length)]);
  }
  if(cfg.epic){
    const hasEpic=drawn.some(c=>c.rarity==='epica'||c.rarity==='legendaria');
    if(!hasEpic){
      let ep=pool.filter(c=>c.rarity==='epica');
      if(!ep.length)ep=pool.filter(c=>c.rarity==='rara');
      if(!ep.length)ep=pool;
      drawn[drawn.length-1]=ep[Math.floor(Math.random()*ep.length)];
    }
  }
  return drawn;
}
function initDB(){return{lastReset:canaryDate(),julia:{pts:0,tasks:[],weeklyTasks:[],monthlyTasks:[],col:{},xp:0,eventProgress:{},achievementProgress:{},tasksCompleted:0,tradesCompleted:0,toquesSent:0},jesus:{pts:0,tasks:[],weeklyTasks:[],monthlyTasks:[],col:{},xp:0,eventProgress:{},achievementProgress:{},tasksCompleted:0,tradesCompleted:0,toquesSent:0},cards:[],trades:[],sounds:{},toques:{},events:[],achievements:[],lastWeeklyReset:'',lastMonthlyReset:''}}

function save(){
  DB_REF.set(S.db).catch(e=>console.error('Firebase save error:',e));
}
function toArr(v){if(!v)return[];if(Array.isArray(v))return v;return Object.values(v);}

function startSync(){
  DB_REF.on('value', snapshot=>{
    const data=snapshot.val();
    if(!data){
      S.db=initDB();
      save();
    }else{
      if(!data.julia)data.julia={pts:0,tasks:[],col:{}};
      if(!data.jesus)data.jesus={pts:0,tasks:[],col:{}};
      data.julia.tasks = toArr(data.julia.tasks);
      data.jesus.tasks = toArr(data.jesus.tasks);
      data.julia.col   = data.julia.col   || {};
      data.jesus.col   = data.jesus.col   || {};
      data.julia.pts   = data.julia.pts   || 0;
      data.jesus.pts   = data.jesus.pts   || 0;
      data.cards  = toArr(data.cards);
      data.trades = toArr(data.trades);
      if(!data.sounds)data.sounds={};
      if(!data.toques)data.toques={};
      if(!data.julia.xp)data.julia.xp=0;
      if(!data.jesus.xp)data.jesus.xp=0;
      if(!data.pokes)data.pokes={};
      if(!data.events)data.events=[];
      if(!data.achievements)data.achievements=[];
      if(!data.lastWeeklyReset)data.lastWeeklyReset='';
      if(!data.lastMonthlyReset)data.lastMonthlyReset='';
      ['julia','jesus'].forEach(u=>{
        if(!data[u].weeklyTasks)data[u].weeklyTasks=[];
        if(!data[u].monthlyTasks)data[u].monthlyTasks=[];
      });
      // Weekly reset: if 7+ days since last reset
      if(data.lastWeeklyReset){
        const _wDiff=(new Date(canaryDate())-new Date(data.lastWeeklyReset))/86400000;
        if(_wDiff>=7){data.lastWeeklyReset=canaryDate();data.julia.weeklyTasks=[];data.jesus.weeklyTasks=[];}
      }else{data.lastWeeklyReset=canaryDate();}
      // Monthly reset
      const _curMonth=canaryDate().slice(0,7);
      if(data.lastMonthlyReset&&data.lastMonthlyReset!==_curMonth){
        data.lastMonthlyReset=_curMonth;data.julia.monthlyTasks=[];data.jesus.monthlyTasks=[];
      }else if(!data.lastMonthlyReset){data.lastMonthlyReset=_curMonth;}
      ['julia','jesus'].forEach(u=>{if(!data[u].achievementProgress)data[u].achievementProgress={};if(!data[u].tasksCompleted)data[u].tasksCompleted=0;if(!data[u].tradesCompleted)data[u].tradesCompleted=0;if(!data[u].toquesSent)data[u].toquesSent=0;});
      if(!data.julia.eventProgress)data.julia.eventProgress={};
      if(!data.jesus.eventProgress)data.jesus.eventProgress={};
      const today=canaryDate();
      if(data.lastReset!==today){
        data.lastReset=today;
        data.julia.tasks=[];
        data.jesus.tasks=[];
      }
      S.db=data;
    }
    if(S.loading){S.loading=false;}
    preloadSounds();
    render();
    checkPendingPoke();
  });
}

// ─── SOUNDS ────────────────────────────────────────────────────────────────
let bgAudio=null;
const audioCache={};

function preloadSounds(){
  if(!S.db||!S.db.sounds)return;
  Object.entries(S.db.sounds).forEach(([key,url])=>{
    if(!url)return;
    try{
      if(!audioCache[key]||audioCache[key].src!==url){
        const a=new Audio();
        a.preload='auto';
        a.src=url;
        audioCache[key]=a;
      }
    }catch(e){}
  });
}

function playSound(key){
  if(S.muted)return;
  const url=(S.db.sounds||{})[key];
  if(!url)return;
  try{
    const cached=audioCache[key];
    if(cached&&cached.readyState>=2){
      const a=cached.cloneNode();
      a.volume=0.7;
      a.play().catch(()=>{});
    }else{
      const a=new Audio(url);
      a.volume=0.7;
      a.play().catch(()=>{});
    }
  }catch(e){}
}
function toggleMute(){
  S.muted=!S.muted;
  if(bgAudio){if(S.muted)bgAudio.pause();else bgAudio.play().catch(()=>{});}
  const btn=document.getElementById('mute-btn');
  if(btn)btn.textContent=S.muted?'🔇':'🔊';
}
function startBgMusic(){

  if(!url||S.muted)return;
  try{bgAudio=new Audio(url);bgAudio.loop=true;bgAudio.volume=0.35;bgAudio.play().catch(()=>{});}catch(e){}
}

// ─── XP SYSTEM ────────────────────────────────────────────────────
function canaryDateTimeToUTC(dateStr,timeStr){
  if(!dateStr)return Date.now();
  try{
    const guess=new Date(dateStr+'T'+timeStr+':00');
    const guessCanary=guess.toLocaleString('sv-SE',{timeZone:'Atlantic/Canary'}).replace(' ','T');
    const guessLocal=guess.toLocaleString('sv-SE').replace(' ','T');
    const diff=new Date(guessCanary)-new Date(guessLocal);
    return guess.getTime()-diff;
  }catch(e){return Date.now();}
}
function canaryDateTimeStr(ts){
  try{
    const d=new Date(ts);
    const s=d.toLocaleString('sv-SE',{timeZone:'Atlantic/Canary'});
    return{date:s.slice(0,10),time:s.slice(11,16)};
  }catch(e){return{date:'',time:'23:59'};}
}
function xpToReachLevel(lv){if(lv<=1)return 0;return 82*(lv-1)*lv/2;}
function getLevel(xp){xp=xp||0;let lv=1;while(xpToReachLevel(lv+1)<=xp)lv++;return lv;}
function xpForNextLevel(lv){return 82*lv;}
function getRank(lv){if(lv>=100)return'diamond';if(lv>=75)return'platinum';if(lv>=50)return'gold';if(lv>=25)return'silver';return'bronze';}
function getRankIcon(rank){const s=S.db&&S.db.sounds||{};return{bronze:s.rankBronze,silver:s.rankSilver,gold:s.rankGold,platinum:s.rankPlatinum,diamond:s.rankDiamond}[rank]||'';}
function getRankEmoji(rank){return{bronze:'🥉',silver:'🥈',gold:'🥇',platinum:'💠',diamond:'💎'}[rank]||'🥉';}
function showXPEffect(amount,leveled){
  const el=document.createElement('div');
  el.textContent='+'+amount+' XP';
  el.style.cssText="position:fixed;top:58px;right:16px;z-index:900;font-family:'Press Start 2P',monospace;font-size:9px;color:#60a5fa;text-shadow:0 0 8px #3b82f688;pointer-events:none;animation:floatUp 1.5s ease-out forwards;";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1600);

    playSound('levelUp');
    const lel=document.createElement('div');
    lel.textContent='Level Up!';
    lel.style.cssText="position:fixed;top:50%;left:50%;z-index:901;font-family:'Press Start 2P',monospace;font-size:24px;color:#60a5fa;text-shadow:0 0 20px #3b82f6aa;pointer-events:none;animation:levelUpAnim 2.5s ease-out forwards;white-space:nowrap;";
    document.body.appendChild(lel);
    setTimeout(()=>lel.remove(),2600);
  }
}
function gainXP(amount){
  if(!S.db||!S.user||S.user==='admin')return;
  const oldLv=getLevel(S.db[S.user].xp||0);
  S.db[S.user].xp=(S.db[S.user].xp||0)+amount;
  const newLv=getLevel(S.db[S.user].xp);
  save();
  showXPEffect(amount,newLv>oldLv);
}

function checkPendingPoke(){
  if(!S.user||S.user==='admin'||!S.db)return;
  const myPoke=(S.db.pokes||{})[S.user];

// ─── PAGES ─────────────────────────────────────────────────────────────────
function calcWeeklyTimer(){
  try{
    const p=new Intl.DateTimeFormat('en-US',{timeZone:'Atlantic/Canary',weekday:'short',hour:'numeric',minute:'numeric',second:'numeric',hour12:false}).formatToParts(new Date());
    const h=+p.find(x=>x.type==='hour').value,m=+p.find(x=>x.type==='minute').value,s=+p.find(x=>x.type==='second').value;
    const wd=p.find(x=>x.type==='weekday').value;
    const dMap={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
    const curSec=h*3600+m*60+s,tgtSec=23*3600+59*60;
    let diff=dMap[wd]===0&&curSec<=tgtSec?tgtSec-curSec:(7-dMap[wd])*86400+(tgtSec-curSec);
    if(diff<0)diff+=7*86400;
    const d=Math.floor(diff/86400),hh=Math.floor((diff%86400)/3600),mm=Math.floor((diff%3600)/60),ss=diff%60;
    return d+'d '+[hh,mm,ss].map(x=>String(x).padStart(2,'0')).join(':');
  }catch{return '--d --:--:--'}
}
function calcMonthlyTimer(){
  try{
    const p=new Intl.DateTimeFormat('en-US',{timeZone:'Atlantic/Canary',year:'numeric',month:'2-digit',day:'2-digit',hour:'numeric',minute:'numeric',second:'numeric',hour12:false}).formatToParts(new Date());
    const get=t=>+p.find(x=>x.type===t).value;
    let ny=get('year'),nm=get('month')+1;if(nm>12){nm=1;ny++;}
    const nextFirst=`${ny}-${String(nm).padStart(2,'0')}-01`;
    const diff=Math.max(0,Math.floor((canaryDateTimeToUTC(nextFirst,'00:00')-Date.now())/1000));
    const d=Math.floor(diff/86400),hh=Math.floor((diff%86400)/3600),mm=Math.floor((diff%3600)/60),ss=diff%60;
    return d+'d '+[hh,mm,ss].map(x=>String(x).padStart(2,'0')).join(':');
  }catch{return '--d --:--:--'}
}

function pageEventos(){
  const evts=S.db.events||[];

  }else{
    active.forEach(evt=>{
      const ep=(ud().eventProgress||{})[evt.id]||{tasks:{},claimed:false,purchased:false,tasksRewarded:{}};
      const allDone=evt.tasks.every(t=>(ep.tasks[t.id]||0)>=t.target);
      const diff=Math.max(0,evt.endDate-now);
      const dd=Math.floor(diff/86400000),hh=Math.floor((diff%86400000)/3600000),mm=Math.floor((diff%3600000)/60000),ss=Math.floor((diff%60000)/1000);
      html+='<div style="background:#130820;border:2px solid #ff69b433;border-radius:16px;overflow:hidden;margin-bottom:24px">';
      if(evt.image)html+='<img src="'+esc(evt.image)+'" style="width:100%;height:160px;object-fit:cover" onerror="this.style.display=\'none\'">';
      html+='<div style="padding:16px">';
      html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px"><div class="pf" style="font-size:11px;color:#ff69b4">'+esc(evt.title)+'</div><div class="pf evt-countdown" data-end="'+evt.endDate+'" style="font-size:6px;color:#fbbf24;text-align:right;flex-shrink:0;margin-left:8px">'+dd+'d '+hh+'h '+mm+'m '+ss+'s</div></div>';
      if(evt.description)html+='<div style="font-size:12px;color:#a0a0c0;margin-bottom:14px;line-height:1.6">'+esc(evt.description)+'</div>';
      html+='<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">';
      evt.tasks.forEach(task=>{
        const cur=(ep.tasks[task.id]||0);

        html+='<div style="background:#0d0618;border:1px solid '+(done?'#4ade8033':'#ff69b422')+';border-radius:10px;padding:10px">';
        html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="pf" style="font-size:7px;color:'+(done?'#4ade80':'#f0d6ff')+'">'+esc(task.title)+'</span><div style="display:flex;gap:6px;flex-shrink:0"><span class="pf" style="font-size:6px;color:#fbbf24">⭐'+task.pts+'</span><span class="pf" style="font-size:6px;color:#60a5fa">+'+task.xp+'XP</span></div></div>';
        html+='<div style="display:flex;align-items:center;gap:8px">';
        html+=(ep.tasksRewarded&&ep.tasksRewarded[task.id])?'<button disabled style="background:#07070f;border:1px solid #333;border-radius:6px;color:#444;cursor:not-allowed;padding:2px 12px;font-size:18px;font-family:monospace;flex-shrink:0">-</button>':'<button onclick="updateEventProgress(\''+evt.id+'\',\''+task.id+'\',-1)" style="background:#ff69b411;border:1px solid #ff69b444;border-radius:6px;color:#ff69b4;cursor:pointer;padding:2px 12px;font-size:18px;font-family:monospace;flex-shrink:0">-</button>';;
        html+='<div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span class="pf" style="font-size:6px;color:#888">'+cur+'/'+task.target+'</span></div><div style="background:#07070f;border-radius:20px;height:7px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:'+(done?'linear-gradient(90deg,#4ade80,#22d3ee)':'linear-gradient(90deg,#ff69b4,#c084fc)')+';border-radius:20px;transition:width .3s"></div></div></div>';
        html+='<button onclick="updateEventProgress(\''+evt.id+'\',\''+task.id+'\',1)" style="background:#ff69b411;border:1px solid #ff69b444;border-radius:6px;color:#ff69b4;cursor:pointer;padding:2px 12px;font-size:18px;font-family:monospace;flex-shrink:0">+</button>';
        html+='</div></div>';
      });

      if(allDone&&!ep.claimed){

      }
      html+='</div></div>';
    });
  }
  html+='</div>';
  return html;
}

function updateEventProgress(evtId,taskId,delta){
  const evt=(S.db.events||[]).find(e=>e.id===evtId);if(!evt)return;
  const task=evt.tasks.find(t=>t.id===taskId);if(!task)return;
  if(!S.db[S.user].eventProgress)S.db[S.user].eventProgress={};
  if(!S.db[S.user].eventProgress[evtId])S.db[S.user].eventProgress[evtId]={tasks:{},claimed:false,purchased:false,tasksRewarded:{}};
  const ep=S.db[S.user].eventProgress[evtId];
  if(!ep.tasksRewarded)ep.tasksRewarded={};
  const cur=ep.tasks[taskId]||0;
  if(delta<0&&ep.tasksRewarded[taskId])return;
  const nv=Math.max(0,Math.min(task.target,cur+delta));
  if(nv>=task.target&&cur<task.target){
    if(!confirm('¿Seguro que has completado esta task?'))return;
    ep.tasksRewarded[taskId]=true;
    ep.tasks[taskId]=nv;
    S.db[S.user].pts+=task.pts;
    gainXP(task.xp);
  }else{
    ep.tasks[taskId]=nv;
  }
  save();render();
}

function claimEventReward(evtId){
  const evt=(S.db.events||[]).find(e=>e.id===evtId);if(!evt)return;
  if(!S.db[S.user].eventProgress)S.db[S.user].eventProgress={};
  const ep=S.db[S.user].eventProgress[evtId]||{tasks:{},claimed:false,tasksRewarded:{}};
  if(ep.claimed)return;
  if(!evt.tasks.every(t=>(ep.tasks[t.id]||0)>=t.target))return;
  S.db[S.user].col[evt.rewardCard.id]=1;
  S.db[S.user].eventProgress[evtId]={...ep,claimed:true};
  save();render();
  playSound('acceptTrade');
  setTimeout(checkAchievements,500);
}

const ACH_CATS={tasks:{lbl:'✅ Tasks',ic:'✅'},coleccionismo:{lbl:'🃏 Coleccionismo',ic:'🃏'},intercambios:{lbl:'🔄 Intercambios',ic:'🔄'},toques:{lbl:'👆 Toques',ic:'👆'},eventos:{lbl:'🎪 Eventos',ic:'🎪'},rango:{lbl:'⭐ Rango',ic:'⭐'}};

function getUserProgress(cat,userId){
  userId=userId||S.user;
  const u=S.db[userId]||{};
  switch(cat){
    case'tasks':return u.tasksCompleted||0;
    case'coleccionismo':{const col=u.col||{};return Object.keys(col).filter(k=>col[k]>0).length;}
    case'intercambios':return u.tradesCompleted||0;
    case'toques':return u.toquesSent||0;
    case'eventos':{const ep=u.eventProgress||{};return Object.values(ep).filter(p=>p&&p.claimed).length;}
    case'rango':return getLevel(u.xp||0);
    default:return 0;
  }
}

function checkAchievements(){
  if(!S.db||!S.user||S.user==='admin')return;
  const achs=S.db.achievements||[];if(!achs.length)return;
  if(!S.db[S.user].achievementProgress)S.db[S.user].achievementProgress={};
  const ap=S.db[S.user].achievementProgress;
  const newlyUnlocked=[];
  achs.forEach(ach=>{
    if(ap[ach.id]&&ap[ach.id].unlocked)return;
    if(getUserProgress(ach.category)>=ach.required){
      ap[ach.id]={unlocked:true};
      newlyUnlocked.push(ach);
    }
  });
  if(newlyUnlocked.length>0){
    save();
    newlyUnlocked.forEach((ach,i)=>setTimeout(()=>showAchievementNotification(ach),i*3200));
  }
}

}

async function downloadCardAsPNG(card){
  if(!card)return;
  const r=R[card.rarity]||R.comun;
  const leg=card.rarity==='legendaria';
  const sc=3,bw=3*sc,pad=9*sc;
  const W=148*sc;
  await document.fonts.ready;
  function rr(ctx,x,y,w,h,rv){
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(x,y,w,h,rv);
    else{ctx.moveTo(x+rv,y);ctx.lineTo(x+w-rv,y);ctx.quadraticCurveTo(x+w,y,x+w,y+rv);ctx.lineTo(x+w,y+h-rv);ctx.quadraticCurveTo(x+w,y+h,x+w-rv,y+h);ctx.lineTo(x+rv,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-rv);ctx.lineTo(x,y+rv);ctx.quadraticCurveTo(x,y,x+rv,y);}
    ctx.closePath();
  }
  const innerW=W-2*pad-2*bw;
  const titleFz=7*sc,imgSz=innerW,descFz=6*sc,descPad=5*sc,rarFz=5*sc;
  // Measure title
  const tmp=document.createElement('canvas').getContext('2d');
  tmp.font=`${titleFz}px 'Press Start 2P',monospace`;
  let tLines=[],tL='';
  for(const w of (card.title||'???').split(' ')){const t=tL+(tL?' ':'')+w;if(tmp.measureText(t).width>innerW&&tL){tLines.push(tL);tL=w;}else tL=t;}
  if(tL)tLines.push(tL);
  const titleH=Math.max(22*sc,tLines.length*(titleFz*1.6));
  // Measure description
  tmp.font=`${descFz}px monospace`;
  let dLines=[],dL='';
  for(const w of (card.description||'Sin descripción').split(' ')){const t=dL+(dL?' ':'')+w;if(tmp.measureText(t).width>(innerW-2*descPad)&&dL){dLines.push(dL);dL=w;}else dL=t;}
  if(dL)dLines.push(dL);
  const descH=Math.max(36*sc,dLines.length*(descFz*1.7)+2*descPad);
  const totalH=Math.ceil(bw+pad+titleH+5*sc+imgSz+5*sc+descH+5*sc+rarFz*2+pad+bw);
  // Create canvas
  const cvs=document.createElement('canvas');cvs.width=W;cvs.height=totalH;
  const ctx=cvs.getContext('2d');
  await document.fonts.ready;
  // Background gradient
  const bgMap={comun:['#1a1a2e','#0d0d1a'],poco_comun:['#051828','#02101e'],rara:['#041a08','#021008'],epica:['#1a0530','#0d0118'],legendaria:['#1a0e00','#100900'],evento:['#2a0520','#1a030f']};
  const [c1,c2]=bgMap[card.rarity]||bgMap.comun;
  const gr=ctx.createLinearGradient(0,0,W*0.6,totalH);
  gr.addColorStop(0,c1);gr.addColorStop(1,c2);
  rr(ctx,0,0,W,totalH,8*sc);ctx.fillStyle=gr;ctx.fill();
  // Border + glow
  if(r.glow&&!leg){ctx.shadowColor=r.b;ctx.shadowBlur=10*sc;}
  ctx.strokeStyle=leg?'#fbbf24':r.b;ctx.lineWidth=bw;
  rr(ctx,bw/2,bw/2,W-bw,totalH-bw,7*sc);ctx.stroke();ctx.shadowBlur=0;
  // Layout positions
  const cx=bw+pad;let cy=bw+pad;
  // Title (Press Start 2P, rarity color, centered)
  const titleLH=titleH/Math.max(1,tLines.length);
  ctx.fillStyle=r.tc;ctx.font=`${titleFz}px 'Press Start 2P',monospace`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  tLines.forEach((l,i)=>ctx.fillText(l,W/2,cy+titleLH*(i+0.5)));
  cy+=titleH+5*sc;
  // Image box (dark bg + rarity border)
  rr(ctx,cx,cy,imgSz,imgSz,4*sc);ctx.fillStyle='#070712';ctx.fill();
  ctx.strokeStyle=r.b+'33';ctx.lineWidth=sc;
  rr(ctx,cx,cy,imgSz,imgSz,4*sc);ctx.stroke();
  if(card.image){
    try{
      let _fURL=card.image;
      const _ghM=_fURL.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/([^?]+)/);
      if(_ghM)_fURL='https://raw.githubusercontent.com/'+_ghM[1]+'/'+_ghM[2]+'/'+_ghM[3];
      const _r=await fetch(_fURL);if(!_r.ok)throw new Error('HTTP '+_r.status);
      const _b=await _r.blob();
      const _d=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(_b);});
      const _i=new Image();await new Promise((res,rej)=>{_i.onload=res;_i.onerror=rej;_i.src=_d;});
      ctx.save();rr(ctx,cx,cy,imgSz,imgSz,4*sc);ctx.clip();ctx.drawImage(_i,cx,cy,imgSz,imgSz);ctx.restore();
    }catch(e){console.error('PNG img:',e);}
  }
  cy+=imgSz+5*sc;
  // Description box (dark bg, monospace, gray text)
  rr(ctx,cx,cy,innerW,descH,4*sc);ctx.fillStyle='#050510';ctx.fill();
  ctx.fillStyle='#777777';ctx.font=`${descFz}px monospace`;
  ctx.textAlign='left';ctx.textBaseline='top';
  dLines.forEach((l,i)=>ctx.fillText(l,cx+descPad,cy+descPad+i*(descFz*1.7)));
  cy+=descH+5*sc;
  // Rarity label
  ctx.fillStyle=r.tc;ctx.font=`${rarFz}px 'Press Start 2P',monospace`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(r.lbl.toUpperCase(),W/2,cy+rarFz);
  // Download
  const a=document.createElement('a');
  a.download=((card.title||'carta').replace(/[^\w\s]/g,'').trim().replace(/\s+/g,'_')||'carta')+'.png';
  a.href=cvs.toDataURL('image/png');a.click();
}

  if(t){t.value=_afc.title;r.value=_afc.rarity;im.value=_afc.image;d.value=_afc.desc}
}
function flashAdmin(msg){const el=document.getElementById('admin-msg');if(el){el.textContent=msg;el.style.display='block';setTimeout(()=>{if(el)el.style.display='none'},2500);}}

// ─── ACTIONS ───────────────────────────────────────────────────────────────
function renderPtsButtons(){document.getElementById('pts-buttons').innerHTML=PTS.map(p=>'<button onclick="S.selPts='+p+';renderPtsButtons()" style="border:1px solid '+(S.selPts===p?'#ff69b4':'#ff69b433')+';border-radius:6px;background:'+(S.selPts===p?'#ff69b4':'transparent')+';color:'+(S.selPts===p?'white':'#ff69b4')+';padding:4px 7px;cursor:pointer;font-size:11px;font-family:\'Press Start 2P\',monospace">'+p+'</button>').join('')}
function togglePw(){const i=document.getElementById('lpw');i.type=i.type==='password'?'text':'password'}

function doLogin(){
  const pw=document.getElementById('lpw').value.trim();
  const lerr=document.getElementById('lerr');
  if(pw===USERS.julia.pw){S.user='julia';S.myCard=null;S.thCard=null;S.pack=null;S.inspect=null;render();startBgMusic();preloadSounds();setTimeout(checkPendingPoke,800);return}
  if(pw===USERS.jesus.pw){S.user='jesus';S.myCard=null;S.thCard=null;S.pack=null;S.inspect=null;render();startBgMusic();preloadSounds();setTimeout(checkPendingPoke,800);return}
  if(pw===APW){S.user='admin';S.myCard=null;S.thCard=null;S.pack=null;S.inspect=null;render();return}
  if(lerr){lerr.textContent='Contraseña incorrecta 💔';lerr.style.display='block'}
}

function doAddTask(){
  const inp=document.getElementById('new-task-inp');
  const title=inp?inp.value.trim():'';
  if(!title)return;
  getMyTasks().push({id:uid(),title,pts:S.selPts,done:false});
  playSound('addTask');save();
}
function doToggleTask(id){
  const task=getMyTasks().find(t=>t.id===id);
  if(!task)return;
  task.done=!task.done;
  if(task.done){playSound('completeTask');gainXP(task.pts);S.db[S.user].tasksCompleted=(S.db[S.user].tasksCompleted||0)+1;setTimeout(checkAchievements,500);}
  S.db[S.user].pts=Math.max(0,S.db[S.user].pts+(task.done?task.pts:-task.pts));
  save();
}
function doDeleteTask(id){
  const task=getMyTasks().find(t=>t.id===id);
  if(task&&task.done)S.db[S.user].pts=Math.max(0,S.db[S.user].pts-task.pts);
  setMyTasks(getMyTasks().filter(t=>t.id!==id));
  save();
}
function doBuyPack(type){
  const cfg=SOBRES[type];
  if(ud().pts<cfg.cost)return;
  if(!S.db.cards.length){alert('No hay cartas aún. El admin tiene que añadirlas primero ✨');return}
  const cards=rollPack(type,S.db.cards);
  cards.forEach(c=>{S.db[S.user].col[c.id]=(S.db[S.user].col[c.id]||0)+1});
  S.db[S.user].pts-=cfg.cost;
  save();
  gainXP(cfg.cost);
  setTimeout(checkAchievements,500);
  playSound('openPack');
  S.pack={type,cards,revealed:0};
  render();
  let i=0;
  const iv=setInterval(()=>{
    i++;S.pack.revealed=i;
    const card=S.pack.cards[i-1];
    if(card)playSound(card.rarity);
    const packCards=document.getElementById('pack-cards');
    if(packCards){packCards.innerHTML=S.pack.cards.map((c,idx)=>idx<i?'<div class="flip-in">'+cardHTML(c,0,false,false)+'</div>':'<div class="blink" style="width:148px;background:#07070f;border:2px solid #ff69b422;border-radius:8px;display:flex;align-items:center;justify-content:center;aspect-ratio:.67"><span style="font-size:36px">🎴</span></div>').join('')}
    if(i>=S.pack.cards.length){clearInterval(iv);const ol=document.querySelector('.overlay>div');if(ol){const b=document.createElement('button');b.className='btn';b.style.width='100%';b.style.marginTop='8px';b.textContent='¡Genial! 🌸';b.onclick=()=>{S.pack=null;render()};ol.appendChild(b)}}
  },650);
}
function doTrade(tid,accept){
  const tr=S.db.trades.find(t=>t.id===tid);
  if(!tr||tr.status!=='pending')return;
  tr.status=accept?'accepted':'rejected';
  if(accept){
    playSound('acceptTrade');
    const fc=S.db[tr.from].col,tc=S.db[tr.to].col;
    if((fc[tr.offered]||0)>0)fc[tr.offered]--;fc[tr.requested]=(fc[tr.requested]||0)+1;
    if((tc[tr.requested]||0)>0)tc[tr.requested]--;tc[tr.offered]=(tc[tr.offered]||0)+1;
    const _oLvT=getLevel(S.db[S.user].xp||0);
    S.db[tr.from].xp=(S.db[tr.from].xp||0)+20;
    S.db[tr.to].xp=(S.db[tr.to].xp||0)+20;
    S.db[tr.from].tradesCompleted=(S.db[tr.from].tradesCompleted||0)+1;
    S.db[tr.to].tradesCompleted=(S.db[tr.to].tradesCompleted||0)+1;
    const _nLvT=getLevel(S.db[S.user].xp);
    save();
    showXPEffect(20,_nLvT>_oLvT);
    setTimeout(checkAchievements,500);
    return;
  }
  save();
}
function doSendTrade(){
  if(!S.myCard||!S.thCard)return;
  const myC=S.db[S.user].col||{},otC=S.db[other()].col||{};
  if((myC[S.myCard]||0)<2){S.myCard=null;render();return}
  if((otC[S.thCard]||0)<1){S.thCard=null;render();return}
  S.db.trades.push({id:uid(),from:S.user,to:other(),offered:S.myCard,requested:S.thCard,status:'pending',ts:Date.now()});
  playSound('requestTrade');
  S.myCard=null;S.thCard=null;save();
}
function doAdminEdit(id){
  const c=S.db.cards.find(c=>c.id===id);if(!c)return;
  S.adminEditId=id;S.adminRarity=c.rarity;
  _afc={title:c.title,rarity:c.rarity,image:c.image||'',desc:c.description||''};
  render();window.scrollTo(0,0);
}
function doAdminSave(){
  const t=document.getElementById('af-title'),r=document.getElementById('af-rarity'),im=document.getElementById('af-image'),d=document.getElementById('af-desc');
  const title=t?t.value.trim():'';if(!title)return;
  const card={id:S.adminEditId||uid(),title,rarity:r?r.value:'comun',image:im?im.value.trim():'',description:d?d.value.trim():''};
  if(S.adminEditId){S.db.cards=S.db.cards.map(c=>c.id===S.adminEditId?card:c)}else{S.db.cards.push(card)}
  S.adminEditId=null;S.adminRarity='comun';_afc={title:'',rarity:'comun',image:'',desc:''};save();render();
  flashAdmin('✅ Carta guardada');
}
function doAdminDelete(id){
  if(!confirm('¿Eliminar esta carta?'))return;
  S.db.cards=S.db.cards.filter(c=>c.id!==id);save();render();
}
function doReset(){
  if(!confirm('RESET TOTAL: borra puntos, tareas, colecciones y trades. Las cartas y sonidos se conservan.'))return;
  if(!confirm('¿Seguro? No se puede deshacer.'))return;
  const snd=S.db.sounds||{},cards=S.db.cards||[];
  S.db={...initDB(),cards,sounds:snd};save();render();
}
function doExport(){
  const b=new Blob([JSON.stringify(S.db,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='paloma-backup.json';a.click();URL.revokeObjectURL(u);
}
function doImport(){
  const ta=document.getElementById('import-ta');if(!ta)return;
  try{
    const d=JSON.parse(ta.value);
    if(!d.julia||!d.jesus)throw new Error('bad');
    S.db=d;save();S.showImport=false;render();
    setTimeout(()=>flashAdmin('✅ Datos importados'),50);
  }catch{alert('JSON inválido.');}
}

// ─── INIT ──────────────────────────────────────────────────────────────────
S.loading=true;
render();
startSync();
setInterval(()=>{
  S.timer=calcTimer();
  document.querySelectorAll('.timer-el').forEach(el=>el.textContent=S.timer);
  S.weeklyTimer=calcWeeklyTimer();S.monthlyTimer=calcMonthlyTimer();
  document.querySelectorAll('.timer-weekly').forEach(el=>el.textContent=S.weeklyTimer);
  document.querySelectorAll('.timer-monthly').forEach(el=>el.textContent=S.monthlyTimer);
  document.querySelectorAll('.evt-countdown').forEach(el=>{const end=+el.dataset.end;const diff=Math.max(0,end-Date.now());const dd=Math.floor(diff/86400000),hh=Math.floor((diff%86400000)/3600000),mm=Math.floor((diff%3600000)/60000),ss=Math.floor((diff%60000)/1000);el.textContent=dd+'d '+hh+'h '+mm+'m '+ss+'s';});
  try{
    const pts=new Intl.DateTimeFormat('en-US',{timeZone:'Atlantic/Canary',hour:'numeric',minute:'numeric',second:'numeric',hour12:false}).formatToParts(new Date());
    const h=+pts.find(p=>p.type==='hour').value,m=+pts.find(p=>p.type==='minute').value,sv=+pts.find(p=>p.type==='second').value;
    if(h===23&&m===59&&sv===0&&S.db){
      S.db.lastReset=canaryDate();
      S.db.julia.tasks=[];S.db.jesus.tasks=[];
      save();render();
    }
    const _wd=new Intl.DateTimeFormat('en-US',{timeZone:'Atlantic/Canary',weekday:'short'}).format(new Date());
    if(_wd==='Sun'&&h===23&&m===59&&sv===0&&S.db){
      S.db.lastWeeklyReset=canaryDate();
      S.db.julia.weeklyTasks=[];S.db.jesus.weeklyTasks=[];
      save();render();
    }
    const _d=+new Intl.DateTimeFormat('en-US',{timeZone:'Atlantic/Canary',day:'2-digit'}).format(new Date());
    if(_d===1&&h===0&&m===0&&sv===0&&S.db){
      S.db.lastMonthlyReset=canaryDate().slice(0,7);
      S.db.julia.monthlyTasks=[];S.db.jesus.monthlyTasks=[];
      save();render();
    }
  }catch(e){}
},1000);
</script>
</body>
